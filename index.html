<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azey — l'application (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14162A;--navy2:#1F2240;--orange:#EB4F33;--cream:#F6F4EF;--grey:#6B6F80;--line:#E6E2D9;--green:#2E8B57;--white:#fff;--soft:#FBFAF7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--navy);background:#ECE8DF;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
/* ---------- panneau de présentation ---------- */
.pitch{width:520px;max-height:100%;overflow:auto;padding:6px 8px 24px 4px;scrollbar-width:thin}
.pitch h1{font-size:44px;line-height:1.05;margin:14px 0 8px;font-weight:800;letter-spacing:-1px}
.pitch h1 b{color:var(--orange)}
.pitch .lead{font-size:16px;color:#3a3d52;margin:0 0 18px;line-height:1.55}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-1px}
.tile{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center}
.tile svg{width:20px;height:22px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.step{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--line)}
.step b{display:block;font-size:28px;color:var(--orange);line-height:1}
.step span{font-size:13px;color:#3a3d52;display:block;margin-top:6px}
.pitch h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:22px 0 10px;font-weight:700}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;transition:.15s}
.feat button:hover{border-color:var(--orange);transform:translateY(-1px)}
.feat i{font-style:normal;font-size:20px;line-height:1.1}
.feat b{display:block;font-size:13px}
.feat small{display:block;font-size:11.5px;color:var(--grey);line-height:1.35;margin-top:1px}
.qrcard{display:flex;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:20px;padding:16px;margin-top:8px}
.qrcard .qr{width:136px;height:136px;background:#fff;border-radius:14px;padding:8px;flex:none;display:grid;place-items:center}
.qrcard .qr svg{width:100%;height:100%;display:block}
.qrcard b{font-size:17px;display:block;margin-bottom:4px}
.qrcard p{margin:0;font-size:12.5px;color:#C9CCD8;line-height:1.5}
.biz{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.biz div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:#3a3d52}
.biz b{display:block;color:var(--navy);font-size:15px}
.note{font-size:11.5px;color:var(--grey);line-height:1.5;margin-top:14px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;margin:2px 0 6px}
.seg button{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--grey)}
.seg button.on{background:var(--navy);color:#fff}
/* ---------- téléphone ---------- */
.device{width:394px;height:828px;flex:none;border-radius:54px;background:#0b0c18;padding:10px;box-shadow:0 40px 80px -20px rgba(20,22,42,.45),0 0 0 2px #2a2d48 inset;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:44px;background:var(--cream);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:20px;background:#0b0c18;z-index:60}
.status{position:relative;z-index:45;height:46px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:13px;font-weight:600;z-index:5}
.status .r{display:flex;gap:5px;align-items:center;font-size:11px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
#view::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:84px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--grey);width:64px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--orange);font-weight:600}
.tab .dot{position:absolute;top:-2px;right:14px;background:var(--orange);color:#fff;font-size:9.5px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;font-weight:700}
.fab{width:56px;height:56px;border-radius:18px;background:var(--orange);display:grid;place-items:center;margin-top:-18px;box-shadow:0 10px 22px -6px rgba(235,79,51,.6)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
/* ---------- briques ---------- */
.pad{padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 18px 8px}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:21px;letter-spacing:-.8px}
.logo .tile{width:30px;height:30px;border-radius:9px}.logo .tile svg{width:14px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.or{background:var(--orange);color:#fff;border-color:var(--orange)}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 18px 6px}
.row::-webkit-scrollbar{display:none}
h2.s{font-size:17px;font-weight:700;margin:18px 18px 8px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.2px}
h2.s small{font-size:12px;color:var(--grey);font-weight:500}
.card{background:#fff;border-radius:20px;border:1px solid var(--line);padding:14px;margin:0 18px 10px;position:relative}
.card.tap{cursor:pointer;transition:.15s}.card.tap:active{transform:scale(.985)}
.sort{display:flex;gap:12px}
.emo{width:48px;height:48px;border-radius:15px;background:var(--cream);display:grid;place-items:center;font-size:24px;flex:none}
.sort h4{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.meta{font-size:12px;color:var(--grey);margin-top:2px;line-height:1.45}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;margin-left:-8px}
.av:first-child{margin-left:0}
.avs{display:flex;align-items:center}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px 14px;border-radius:14px;font-weight:600;font-size:13.5px;text-align:center;background:var(--orange);color:#fff}
.btn.sec{background:var(--cream);color:var(--navy);border:1px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--grey);border:1px solid var(--line)}
.btn.wide{display:block;width:100%;flex:none}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:12px;flex:none}
.btn[disabled]{opacity:.45}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--cream);color:var(--navy)}
.badge.or{background:rgba(235,79,51,.12);color:var(--orange)}
.badge.gr{background:rgba(46,139,87,.12);color:var(--green)}
.badge.nv{background:var(--navy);color:#fff}
.compat{flex:none}
.hero{margin:6px 18px 12px;background:var(--navy);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.hero h3{margin:0;font-size:21px;line-height:1.15;letter-spacing:-.4px}
.hero p{margin:6px 0 0;font-size:12.5px;color:#C9CCD8;line-height:1.5}
.hero .bg{position:absolute;right:-18px;top:-10px;width:130px;opacity:.12}
.switch{width:46px;height:28px;border-radius:15px;background:#D4D1C9;position:relative;flex:none;transition:.2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--orange)}.switch.on::after{left:21px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .grow{flex:1;min-width:0}
.line b{font-size:14px;font-weight:600;display:block}
.line small{font-size:12px;color:var(--grey);display:block;line-height:1.4}
/* annonce */
.ad{margin:0 18px 10px;border-radius:14px;background:#fff;border:1px dashed #D8D4CA;display:flex;align-items:center;gap:10px;padding:8px 10px}
.ad .l{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:#FFF1D6;flex:none}
.ad b{font-size:12.5px;display:block;line-height:1.25}
.ad small{font-size:10.5px;color:var(--grey)}
.ad .x{margin-left:auto;font-size:11px;color:var(--grey);padding:4px 6px}
/* notification push */
.push{opacity:0;visibility:hidden;position:absolute;left:10px;right:10px;top:50px;z-index:70;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-radius:22px;padding:12px;box-shadow:0 18px 40px -10px rgba(20,22,42,.45);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;border:1px solid var(--line)}
.push.show{transform:none;opacity:1;visibility:visible}
.push .h{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--grey);font-weight:500}
.push .h .tile{width:22px;height:22px;border-radius:7px}.push .h .tile svg{width:11px;height:12px}
.push p{margin:6px 0 8px;font-size:13.5px;font-weight:500;line-height:1.35}
.toast{position:absolute;left:50%;bottom:98px;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:12.5px;font-weight:500;opacity:0;transition:.3s;z-index:80;max-width:320px;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* feuilles */
.scrim{position:absolute;inset:0;background:rgba(20,22,42,.55);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:28px 28px 0 0;z-index:55;padding:10px 18px 28px;transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.2,1),visibility 0s .35s;max-height:88%;overflow-y:auto}
.sheet.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:#CFCBC1;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
.sheet p.sub{margin:0 0 14px;font-size:13px;color:var(--grey);line-height:1.5}
.full{position:absolute;inset:0;background:var(--cream);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
.full.show{transform:none;visibility:visible;transition:transform .3s ease}
.full .bar{display:flex;align-items:center;gap:10px;padding:52px 14px 10px;flex:none}
.full .bar .t{font-weight:700;font-size:16px;flex:1}
.back{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.full .body{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
.full .body::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px}
.act{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;text-align:center;line-height:1.15}
.act i{font-style:normal;font-size:23px}
.act.on{border-color:var(--orange);background:#FFF3F0}
.prog{display:flex;gap:5px;padding:0 18px 12px}
.prog i{flex:1;height:4px;border-radius:2px;background:#DAD6CC}.prog i.on{background:var(--orange)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;font-weight:600}
.stepper b{font-size:22px;min-width:24px;text-align:center}
.mapwrap{margin:0 18px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#EFECE4;position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.qrframe{position:relative;margin:6px auto 14px;width:230px;height:230px;border-radius:24px;background:#0b0c18;overflow:hidden;display:grid;place-items:center}
.qrframe::before,.qrframe::after{content:'';position:absolute;inset:26px;border:3px solid var(--orange);border-radius:16px;clip-path:polygon(0 0,28% 0,28% 3px,3px 3px,3px 28%,0 28%,0 0,100% 0,100% 28%,calc(100% - 3px) 28%,calc(100% - 3px) 3px,72% 3px,72% 0,100% 0,100% 100%,72% 100%,72% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 72%,100% 72%,100% 100%,0 100%,0 72%,3px 72%,3px calc(100% - 3px),28% calc(100% - 3px),28% 100%,0 100%)}
.scanline{position:absolute;left:30px;right:30px;height:3px;background:var(--orange);box-shadow:0 0 14px var(--orange);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:36px}50%{top:190px}100%{top:36px}}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13px;line-height:1.4;margin-bottom:6px}
.bubble.in{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.out{background:var(--orange);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bubble small{display:block;font-size:10px;opacity:.7;margin-bottom:1px;font-weight:600}
.inp{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;font-size:14px;color:var(--navy);outline:0}
.inp:focus{border-color:var(--orange)}
.big{font-size:30px;font-weight:800;letter-spacing:-1px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi small{font-size:11px;color:var(--grey);display:block}
.kpi b{font-size:22px;letter-spacing:-.5px}
.locked{filter:blur(3.5px);pointer-events:none;user-select:none}
.lockov{position:relative}
.lockov .ov{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
input[type=range]{width:100%;accent-color:#EB4F33}
.ob{height:100%;display:flex;flex-direction:column;padding:0 22px 26px;background:var(--navy);color:#fff}
.ob .art{flex:1;display:grid;place-items:center}
.ob h2{font-size:28px;line-height:1.12;margin:0 0 10px;letter-spacing:-.8px}
.ob p{font-size:14px;color:#C9CCD8;line-height:1.55;margin:0 0 18px}
.dots{display:flex;gap:6px;margin-bottom:16px}.dots i{width:7px;height:7px;border-radius:4px;background:#3a3d5c}.dots i.on{width:22px;background:var(--orange)}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* présentation (mobile) */
.mbtn{display:none}.mo{display:none}
@media (max-width:980px){
  body{overflow:hidden;background:var(--cream)}
  .stage{padding:0;gap:0;display:block}
  .pitch{display:none}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .screen{border-radius:0}
  .island{display:none}
  .status{height:env(safe-area-inset-top);min-height:6px;padding:0}.status span{display:none}
  .mo{display:inline-flex !important}
  .tabbar{height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  .full .bar{padding-top:calc(env(safe-area-inset-top) + 14px)}
  .push{top:calc(env(safe-area-inset-top) + 8px)}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
}
.overlay{position:fixed;inset:0;background:var(--cream);z-index:200;overflow:auto;padding:22px 18px 40px;display:none}
.overlay.show{display:block}
.overlay .pitch{display:block;width:auto;max-height:none;overflow:visible}
.overlay .feat{grid-template-columns:1fr}
.overlay .qrcard{display:none}
@media (max-height:860px) and (min-width:981px){.device{transform:scale(.9);transform-origin:center}}
@media (max-height:760px) and (min-width:981px){.device{transform:scale(.78)}}
</style>
<style>
.mbtn{display:none}
@media (max-width:980px){.mbtn{display:block;position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:150;background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.25)}}
.pitch .seg button{cursor:pointer}
.sheet,.full{font-family:inherit}
</style>
</head>
<body>
<div class="stage">
  <aside class="pitch" id="pitch"></aside>
  <div class="device"><div class="screen" id="screen">
    <div class="island"></div>
    <div class="status"><span id="clock">18:42</span><span class="r"><span>5G</span><span>▮▮▮</span><span>▭</span></span></div>
    <div id="view"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="push" id="push"></div>
    <div class="toast" id="toast"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="full" id="full"></div>
  </div></div>
</div>
<div class="overlay" id="overlay"></div>
<style>
.screen.dark .status{background:var(--navy);color:#fff}
.sosbtn{background:#C8321E;color:#fff;font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px}
.badge.lock{background:#EAE7DF;color:#9A9CA8}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;margin-right:6px}
.v1{background:rgba(46,139,87,.14);color:#237246}.v2{background:rgba(235,79,51,.13);color:#C8391F}.v3{background:rgba(20,22,42,.1);color:var(--navy)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.bar2{height:8px;border-radius:5px;background:#EAE7DF;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--orange)}
.vote{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.vote .chip{font-size:11.5px;padding:5px 9px}
.mini{font-size:11px;color:var(--grey);line-height:1.45}
.pulse{animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(235,79,51,.5)}70%{box-shadow:0 0 0 14px rgba(235,79,51,0)}100%{box-shadow:0 0 0 0 rgba(235,79,51,0)}}
.spin{width:34px;height:34px;border:4px solid #E4E1D8;border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script>
(function(){
'use strict';
/* ====== DONNÉES DE DÉMONSTRATION (fictives) ====== */
var BOLT='0.56,0 0.12,0.54 0.44,0.54 0.30,1 0.84,0.40 0.52,0.40';
function bolt(w,h,c){return '<svg viewBox="0 0 1 1" width="'+w+'" height="'+h+'" preserveAspectRatio="none"><polygon points="'+BOLT+'" fill="'+(c||'#EB4F33')+'"/></svg>';}
function tile(s){return '<span class="tile" style="width:'+s+'px;height:'+s+'px;border-radius:'+Math.round(s*.28)+'px">'+bolt(Math.round(s*.46),Math.round(s*.52))+'</span>';}
var COL=['#EB4F33','#2B3A67','#C48A2C','#2E8B57','#7A4FA3','#D1495B','#3A7CA5','#8A6F5A'];
var U={

/* ====== Générateur de QR code (mode octets, correction M, versions 1-10) ====== */
function azeyQR(text){
  var ECC=[-1,10,16,26,18,24,16,18,22,22,26],BLK=[-1,1,1,1,2,2,4,4,4,5,5];
  var bytes=unescape(encodeURIComponent(text)).split('').map(function(c){return c.charCodeAt(0);});
  function raw(v){var r=(16*v+128)*v+64;if(v>=2){var n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;}
  var ver,cap,i,j,x,y;
  for(ver=1;ver<=10;ver++){cap=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver];if(4+(ver<10?8:16)+bytes.length*8<=cap*8)break;}
  if(ver>10)return '';
  var bits=[];
  function put(v,n){for(var k=n-1;k>=0;k--)bits.push((v>>>k)&1);}
  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(function(b){put(b,8);});
  put(0,Math.min(4,cap*8-bits.length));
  while(bits.length%8)bits.push(0);
  for(var pad=0xEC;bits.length<cap*8;pad^=0xEC^0x11)put(pad,8);
  var data=[];
  for(i=0;i<bits.length;i+=8){var by=0;for(j=0;j<8;j++)by=(by<<1)|bits[i+j];data.push(by);}
  function mul(a,b){var z=0;for(var k=7;k>=0;k--){z=(z<<1)^((z>>>7)*0x11D);z^=((b>>>k)&1)*a;}return z;}
  function rsDiv(d){var r=[];for(var a=0;a<d-1;a++)r.push(0);r.push(1);var root=1;
    for(var a2=0;a2<d;a2++){for(var b=0;b<d;b++){r[b]=mul(r[b],root);if(b+1<d)r[b]^=r[b+1];}root=mul(root,2);}return r;}
  function rsRem(dat,div){var r=div.map(function(){return 0;});
    dat.forEach(function(b){var f=b^r.shift();r.push(0);div.forEach(function(c,k){r[k]^=mul(c,f);});});return r;}
  var nb=BLK[ver],el=ECC[ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),div=rsDiv(el),blocks=[],k0=0;
  for(i=0;i<nb;i++){var dat=data.slice(k0,k0+sl-el+(i<ns?0:1));k0+=dat.length;var ecc=rsRem(dat,div);if(i<ns)dat.push(0);blocks.push(dat.concat(ecc));}
  var all=[];
  for(i=0;i<blocks[0].length;i++)blocks.forEach(function(b,jj){if(i!=sl-el||jj>=ns)all.push(b[i]);});
  var size=ver*4+17,M=[],F=[];
  for(i=0;i<size;i++){M.push([]);F.push([]);for(j=0;j<size;j++){M[i].push(false);F[i].push(false);}}
  function setF(px,py,d){M[py][px]=d;F[py][px]=true;}
  for(i=0;i<size;i++){setF(6,i,i%2==0);setF(i,6,i%2==0);}
  function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var dist=Math.max(Math.abs(dx),Math.abs(dy)),xx=cx+dx,yy=cy+dy;
    if(xx>=0&&xx<size&&yy>=0&&yy<size)setF(xx,yy,dist!=2&&dist!=4);}}
  finder(3,3);finder(size-4,3);finder(3,size-4);
  var na=ver>1?Math.floor(ver/7)+2:0,pos=[];
  if(na){var step=Math.ceil((ver*4+4)/(na*2-2))*2;pos=[6];for(var p=size-7;pos.length<na;p-=step)pos.splice(1,0,p);}
  for(i=0;i<na;i++)for(j=0;j<na;j++){
    if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))continue;
    for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)setF(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1);
  }
  function fmt(mask){
    var d=mask,r=d;for(var a=0;a<10;a++)r=(r<<1)^((r>>>9)*0x537);
    var b=((d<<10)|r)^0x5412;function g(n){return ((b>>>n)&1)!=0;}
    for(var a2=0;a2<=5;a2++)setF(8,a2,g(a2));
    setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));
    for(var a3=9;a3<15;a3++)setF(14-a3,8,g(a3));
    for(var a4=0;a4<8;a4++)setF(size-1-a4,8,g(a4));
    for(var a5=8;a5<15;a5++)setF(8,size-15+a5,g(a5));
    setF(8,size-8,true);
  }
  fmt(0);
  if(ver>=7){var vr=ver;for(i=0;i<12;i++)vr=(vr<<1)^((vr>>>11)*0x1F25);var vb=(ver<<12)|vr;
    for(i=0;i<18;i++){var bt=((vb>>>i)&1)!=0,a=size-11+i%3,b=Math.floor(i/3);setF(a,b,bt);setF(b,a,bt);}}
  var n=0;
  for(var right=size-1;right>=1;right-=2){
    if(right==6)right=5;
    for(var vert=0;vert<size;vert++)for(j=0;j<2;j++){
      x=right-j;y=((right+1)&2)==0?size-1-vert:vert;
      if(!F[y][x]&&n<all.length*8){M[y][x]=((all[n>>>3]>>>(7-(n&7)))&1)!=0;n++;}
    }
  }
  function applyMask(m){
    for(y=0;y<size;y++)for(x=0;x<size;x++){
      var inv;
      switch(m){
        case 0:inv=(x+y)%2==0;break;
        case 1:inv=y%2==0;break;
        case 2:inv=x%3==0;break;
        case 3:inv=(x+y)%3==0;break;
        case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2==0;break;
        case 5:inv=x*y%2+x*y%3==0;break;
        case 6:inv=(x*y%2+x*y%3)%2==0;break;
        default:inv=((x+y)%2+x*y%3)%2==0;
      }
      if(!F[y][x]&&inv)M[y][x]=!M[y][x];
    }
  }
  function penalty(){
    var pn=0,dark=0,lines=[],s;
    for(var r=0;r<size;r++){s='';for(var c=0;c<size;c++){s+=M[r][c]?'1':'0';if(M[r][c])dark++;}lines.push(s);}
    for(var c2=0;c2<size;c2++){s='';for(var r2=0;r2<size;r2++)s+=M[r2][c2]?'1':'0';lines.push(s);}
    lines.forEach(function(l){
      var run=1,q;
      for(q=1;q<=size;q++){if(q<size&&l[q]==l[q-1])run++;else{if(run>=5)pn+=run-2;run=1;}}
      for(q=0;q+11<=size;q++){var t=l.substr(q,11);if(t=='10111010000'||t=='00001011101')pn+=40;}
    });
    for(var r3=0;r3<size-1;r3++)for(var c3=0;c3<size-1;c3++){var v=M[r3][c3];if(v==M[r3][c3+1]&&v==M[r3+1][c3]&&v==M[r3+1][c3+1])pn+=3;}
    var tot=size*size;pn+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;
    return pn;
  }
  var best=0,bp=1e9;
  for(var m=0;m<8;m++){applyMask(m);fmt(m);var pp=penalty();if(pp<bp){bp=pp;best=m;}applyMask(m);}
  applyMask(best);fmt(best);
  var d='';
  for(y=0;y<size;y++){x=0;while(x<size){if(M[y][x]){var s0=x;while(x<size&&M[y][x])x++;d+='M'+s0+' '+y+'h'+(x-s0)+'v1h-'+(x-s0)+'z';}else x++;}}
  var t=size+8;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 '+t+' '+t+'" shape-rendering="crispEdges" role="img" aria-label="QR code vers l\'application Azey"><rect x="-4" y="-4" width="'+t+'" height="'+t+'" fill="#fff"/><path d="'+d+'" fill="#14162A"/></svg>';
}

  else if(k==='match'){S.cat='me';jump('home');}
  else if(k==='score'){jump('me');}
  else if(k==='chat'){join('o1');go(detail('o1'));go(chatScr('o1'));}
  else if(k==='offers'){jump('offers');}
  else if(k==='partner'){go(partnerScr());}
  else if(k==='circles'){go(circlesScr());}
  else if(k==='plus'){go(plusScr());}
  else if(k==='sig'){S.cat='all';jump('home',99999);}
  else if(k==='ads'){S.plus=false;S.cat='all';jump('home');var ad=view.querySelector('.ad');if(ad)view.scrollTop=ad.offsetTop-160;}
  else if(k==='campus'){jump('me',99999);}
 }
};
document.addEventListener('click',function(e){
 var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
 var fn=A[el.getAttribute('data-act')];if(!fn)return;
 if(el.disabled)return;
 if(el.closest('#push'))hidePush();
 fn({id:el.getAttribute('data-id')},el);
});
document.addEventListener('input',function(e){var t=e.target,k=t.getAttribute&&t.getAttribute('data-in');if(!k)return;
 if(k==='name'){S.name=t.value;var b=document.querySelector('[data-act="obdone"]');if(b)b.disabled=!(Object.keys(S.interests).length>=3&&S.name.trim());}
 if(k==='radius'){S.radius=RADII[+t.value];var r=document.getElementById('rv');if(r)r.textContent=rLabel(S.radius);}
 if(k==='cap'){S.cap=+t.value;var c=document.getElementById('cv');if(c)c.textContent=S.cap+' maximum (réglable)';}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='chatin'){e.preventDefault();sendMsg(e.target.getAttribute('data-id'));}});
document.getElementById('pitch').innerHTML=pitchHtml(false);
render();
})();
</script>
